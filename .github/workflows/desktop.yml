# Desktop builds (Tauri 2): Windows / macOS (arm64 + Intel) / Linux
# 手动触发或打 tag 时构建；产物上传为 workflow artifacts，
# tag 构建额外挂载到 GitHub Releases 页面（发布版本 + 安装包）。
# macOS 出两条腿：arm64（Apple Silicon 默认）+ x86_64（Intel，--target 交叉编译）。
# SECURITY: 依赖全部来自 npm/ crates.io，不经第三方镜像；无签名密钥，
# macOS 产物为 ad-hoc 签名（首启需右键打开）。
name: Desktop Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  # Build-provenance attestation (actions/attest-build-provenance): keyless,
  # backed by GitHub's own Sigstore identity — the pipeline holds NO signing
  # keys of its own, by design.
  # 构建来源证明：无自持密钥，走 GitHub 自身的 Sigstore 身份签发。
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
            suffix: arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            suffix: intel
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Intel mac leg compiles for x86_64: add the cross target to the toolchain.
      # Intel 腿交叉编译 x86_64：向工具链添加目标三元组。
      - name: Add Rust cross target (Intel mac)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: rustup target add x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Verify Cargo.lock is present and consistent (--locked)
        run: cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml

      - name: Install Linux deps (webkit2gtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Build web client
        env:
          # v1.8.0 #20: optional build-time baked default server URL
          # (repository VARIABLE, not secret — it ships inside the binaries).
          JMLT_DEFAULT_SERVER: ${{ vars.JMLT_DEFAULT_SERVER_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build

      # Tauri CLI comes from the pinned npm package in desktop/package.json
      # (prebuilt binary) — the CLI is never compiled from source with cargo.
      # Tauri CLI 用 desktop/package.json 里钉版的 npm 包（预编译二进制），
      # 不再用 cargo 从源码编译。
      - name: Install Tauri CLI (pinned npm package)
        working-directory: desktop
        run: npm ci --ignore-scripts

      - name: Derive Tauri icons (.icns/.ico) from source PNG
        working-directory: desktop
        run: npx tauri icon src-tauri/icons/icon-source.png -o src-tauri/icons

      - name: Build desktop bundles
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jiamiliaotian-windows
          path: desktop/src-tauri/target/release/bundle/*/jiamiliaotian.*

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: jiamiliaotian-macos-${{ matrix.suffix }}
          if-no-files-found: error
          # `**` covers both plain (target/release) and cross (target/x86_64-apple-darwin/release) layouts
          # `**` 同时覆盖原生与交叉编译两种目录布局
          path: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: jiamiliaotian-linux
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      # Supply-chain: SHA-256 checksums + keyless build-provenance
      # attestation for this leg's release bundles (tag builds only).
      # Users can verify downloads against SHA256SUMS-<platform>.txt and
      # `gh attestation verify <file> --owner <owner>`.
      # 供应链：为本腿的发布产物生成 SHA-256 清单并做无密钥构建来源证明
      # （仅 tag 构建）。用户可据 SHA256SUMS-<平台>.txt 校验下载，或用
      # `gh attestation verify` 验证来源。
      - name: Generate SHA-256 checksums (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle
          sha256sum msi/*.msi nsis/*.exe > "$GITHUB_WORKSPACE/SHA256SUMS-windows.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-windows.txt"

      - name: Attest build provenance (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Generate SHA-256 checksums (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(desktop/src-tauri/target/**/bundle/dmg/*.dmg desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz)
          shasum -a 256 "${files[@]}" > "$GITHUB_WORKSPACE/SHA256SUMS-macos-${{ matrix.suffix }}.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-macos-${{ matrix.suffix }}.txt"

      - name: Attest build provenance (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz

      - name: Generate SHA-256 checksums (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          cd desktop/src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > "$GITHUB_WORKSPACE/SHA256SUMS-linux.txt"
          cat "$GITHUB_WORKSPACE/SHA256SUMS-linux.txt"

      - name: Attest build provenance (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      # Release: attach this platform's bundles to the GitHub Release for the
      # pushed tag (softprops merges all matrix legs into the same release;
      # it creates the release if it does not exist yet).
      # 发布：tag 构建时把本平台安装包挂到对应的 GitHub Release。
      - name: Attach bundles to GitHub Release (Windows)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (pinned by commit SHA; was floating @v2)
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-windows.txt

      - name: Attach bundles to GitHub Release (macOS)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'macos-latest'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (pinned by commit SHA; was floating @v2)
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/**/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/bundle/macos/*.app.tar.gz
            SHA256SUMS-macos-${{ matrix.suffix }}.txt

      - name: Attach bundles to GitHub Release (Linux)
        if: startsWith(github.ref, 'refs/tags/') && matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2 (pinned by commit SHA; was floating @v2)
        with:
          fail_on_unmatched_files: false
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            SHA256SUMS-linux.txt
