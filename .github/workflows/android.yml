# Android build (Tauri 2 mobile): arm64 + armv7 + x86_64 APKs + Play Store AAB
# 手动触发或打 tag 时构建；产物挂到 GitHub Releases。
# 覆盖矩阵：arm64（现代真机）+ armv7（老 32 位设备）+ x86_64（平板/模拟器/Chromebook）。
# SECURITY: 依赖全部来自 npm/ crates.io / maven central。
# 签名策略（v1.7.0 #18）：
#   - 若仓库配置了 ANDROID_KEY_BASE64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#     secrets → release 签名 APK（可上架）+ 可选 ANDROID_VERSION_CODE 覆盖
#     versionCode + 独立 AAB（Google Play 上传格式）；
#   - 未配置 → debug 签名 APK（可安装未知来源，正式分发需用户自有 keystore，
#     本管线默认不持有任何密钥材料）。
name: Android Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64
            rust_target: aarch64-linux-android
            arch: arm64
          - target: armv7
            rust_target: armv7-linux-androideabi
            arch: armv7
          - target: x86_64
            rust_target: x86_64-linux-android
            arch: x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build web client
        env:
          # v1.8.0 #20: optional build-time baked default server URL
          # (repository VARIABLE, not secret — it ships inside the binaries).
          JMLT_DEFAULT_SERVER: ${{ vars.JMLT_DEFAULT_SERVER_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Derive Tauri icons from source PNG
        run: |
          npx --yes @tauri-apps/cli@latest icon desktop/src-tauri/icons/icon-source.png -o desktop/src-tauri/icons

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Resolve Android SDK / NDK env (runner-preinstalled)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK found" >&2; exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using NDK: $NDK_DIR"

      - name: Init Android project (generated in CI, not committed)
        working-directory: desktop/src-tauri
        run: cargo tauri android init

      - name: Apply shell capabilities (media permissions)
        run: python3 scripts/android-apply-shell.py desktop/src-tauri/gen/android

      - name: Apply release signing when keystore secrets are present
        id: sign
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ secrets.ANDROID_VERSION_CODE }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            cat > desktop/src-tauri/gen/android/keystore.properties <<PROPS
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=${RUNNER_TEMP}/keystore.jks
          PROPS
            node scripts/android-apply-signing.mjs desktop/src-tauri/gen/android
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "No signing secrets configured — building a debug-signed APK (sideload-only)."
          fi

      - name: Build ${{ matrix.arch }} APK
        working-directory: desktop/src-tauri
        run: |
          if [ "${{ steps.sign.outputs.mode }}" = "release" ]; then
            cargo tauri android build --apk --target ${{ matrix.target }}
          else
            cargo tauri android build --apk --debug --target ${{ matrix.target }}
          fi

      - name: Collect APK with clean name
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          fi
          if [ -z "$APK" ]; then echo "No APK produced" >&2; exit 1; fi
          cp "$APK" "release-assets/jiamiliaotian_${VER}_android_${{ matrix.arch }}.apk"
          ls -la release-assets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiamiliaotian-android-${{ matrix.arch }}
          path: release-assets/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: release-assets/*.apk

  # v1.7.0 #18: Play Store upload bundle (.aab). Built once (arm64 ABI set)
  # and only when signing secrets exist — an unsigned AAB is useless.
  bundle:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust with Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build web client
        env:
          # v1.8.0 #20: optional build-time baked default server URL
          # (repository VARIABLE, not secret — it ships inside the binaries).
          JMLT_DEFAULT_SERVER: ${{ vars.JMLT_DEFAULT_SERVER_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Derive Tauri icons from source PNG
        run: |
          npx --yes @tauri-apps/cli@latest icon desktop/src-tauri/icons/icon-source.png -o desktop/src-tauri/icons

      - name: Install tauri-cli
        run: cargo install tauri-cli --version '^2' --locked

      - name: Resolve Android SDK / NDK env (runner-preinstalled)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          NDK_DIR=$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK_DIR" ]; then
            echo "No preinstalled NDK found" >&2; exit 1
          fi
          echo "NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

      - name: Init Android project (generated in CI, not committed)
        working-directory: desktop/src-tauri
        run: cargo tauri android init

      - name: Apply shell capabilities (media permissions)
        run: python3 scripts/android-apply-shell.py desktop/src-tauri/gen/android

      - name: Apply release signing (required for AAB)
        id: sign
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ secrets.ANDROID_VERSION_CODE }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            cat > desktop/src-tauri/gen/android/keystore.properties <<PROPS
          keyAlias=${ANDROID_KEY_ALIAS}
          password=${ANDROID_KEY_PASSWORD}
          storeFile=${RUNNER_TEMP}/keystore.jks
          PROPS
            node scripts/android-apply-signing.mjs desktop/src-tauri/gen/android
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "No signing secrets — skipping AAB (Google Play requires a signed bundle)." >&2
          fi

      - name: Build signed AAB
        if: steps.sign.outputs.mode == 'release'
        working-directory: desktop/src-tauri
        run: cargo tauri android build --aab --target aarch64

      - name: Collect AAB with clean name
        if: steps.sign.outputs.mode == 'release'
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p release-assets
          AAB=$(find desktop/src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' ! -name '*unsigned*' | head -1)
          if [ -z "$AAB" ]; then echo "No AAB produced" >&2; exit 1; fi
          cp "$AAB" "release-assets/jiamiliaotian_${VER}_android.aab"
          ls -la release-assets

      - name: Upload artifact
        if: steps.sign.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: jiamiliaotian-android-aab
          path: release-assets/*.aab
          if-no-files-found: error

      - name: Attach AAB to GitHub Release
        if: steps.sign.outputs.mode == 'release' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: release-assets/*.aab
