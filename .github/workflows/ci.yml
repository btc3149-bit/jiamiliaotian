name: CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: esbuild's postinstall is unnecessary here (the
      # binary ships as an optional platform dependency) and is the only
      # script that ever breaks sandboxed installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build client bundle
        run: npm run build

      - name: Crypto interop & tamper tests
        run: npm test

      - name: Syntax check all JS sources
        run: |
          for f in server/server.js worker/index.js worker/utils.js client/js/*.js; do
            node --check "$f"
          done
