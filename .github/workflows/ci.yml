name: CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Desktop/Android release builds use Node 20 while CI previously
        # only tested Node 22 — test both lines that actually ship.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --ignore-scripts: esbuild's postinstall is unnecessary here (the
      # binary ships as an optional platform dependency) and is the only
      # script that ever breaks sandboxed installs.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Non-blocking during the observation period (first 1-2 weeks):
      # surface high/critical advisories in the log without failing CI.
      # After the observation period, remove `continue-on-error` (and the
      # `|| true`) to turn this into a hard gate.
      - name: Audit dependencies (non-blocking, observation period)
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Build client bundle
        run: npm run build

      - name: Install server dependencies (integration tests)
        working-directory: server
        run: npm ci --ignore-scripts

      - name: Crypto interop & tamper tests
        run: npm test

      # Item 22: Worker smoke (Miniflare ships in the tree via wrangler).
      - name: Worker smoke test (Miniflare)
        run: node scripts/worker-smoke.mjs

      # Item 2: glob instead of a hand-written list — the old list had
      # already missed worker/ratelimit.js and client/public/sw.js.
      - name: Syntax check all JS sources
        run: |
          for f in server/*.js worker/*.js client/js/*.js client/public/*.js scripts/*.mjs test-*.mjs; do
            node --check "$f"
          done

  # Item 22: PR-level docker build (build only, never pushes) so a broken
  # Dockerfile fails the PR instead of surfacing after merge.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: docker build -t jiamiliaotian-ci .
